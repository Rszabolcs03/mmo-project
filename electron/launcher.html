<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top-Down MMO Prototype Launcher</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <main class="launcher-shell">
      <section class="hero-panel">
        <div>
          <p class="eyebrow">MMO Prototype</p>
          <h1>Top-Down MMO</h1>
          <p class="subtitle">Check the client version and launch the game.</p>
        </div>

        <div class="status-grid">
          <div>
            <span>Client version</span>
            <strong id="version">v0.1.0</strong>
          </div>
          <div>
            <span>Status</span>
            <strong id="clientStatus">Checking...</strong>
          </div>
        </div>

        <div class="quick-actions">
          <button type="button" id="checkUpdate">Check update</button>
        </div>

        <button class="play-button" id="playButton" type="button">Play</button>
        <button class="play-button update-button" id="updateButton" type="button" hidden>Update</button>
        <p class="update-status" id="updateStatus">Checking for updates...</p>
      </section>
    </main>

    <script src="./launcher.js"></script>
  </body>
</html>
